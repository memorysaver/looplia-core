<svg viewBox="0 0 140 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Two Circles: Human & AI Agent Dialogue -->
  <g>
    <!-- Human circle (left) -->
    <circle cx="12" cy="16" r="8"
      fill="none" stroke="#f5b8a6" stroke-width="2"/>
    <!-- AI circle (right, overlapping) -->
    <circle cx="22" cy="16" r="8"
      fill="none" stroke="#f5b8a6" stroke-width="2"/>
  </g>

  <!-- Wordmark -->
  <text x="40" y="22"
    font-family="Syne, -apple-system, BlinkMacSystemFont, sans-serif"
    font-weight="700"
    font-size="18"
    letter-spacing="-0.02em"
    fill="#f0f0f0">Looplia</text>
</svg>
