<svg viewBox="0 0 140 32" xmlns="http://www.w3.org/2000/svg">
  <!-- The Loop Arc -->
  <path d="M5,16 Q16,2 27,16"
    fill="none" stroke="#f5b8a6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Human circle - outline -->
  <circle cx="9" cy="16" r="6"
    fill="none" stroke="#d97757" stroke-width="2"/>

  <!-- AI Agent circle - filled -->
  <circle cx="23" cy="16" r="6" fill="#d97757"/>

  <!-- Flow dot on arc -->
  <circle cx="16" cy="5" r="1.5" fill="#d97757"/>

  <!-- Wordmark -->
  <text x="38" y="22"
    font-family="Syne, -apple-system, BlinkMacSystemFont, sans-serif"
    font-weight="700" font-size="18" letter-spacing="-0.02em"
    fill="#2d2d2d">Looplia</text>
</svg>
