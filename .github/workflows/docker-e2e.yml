name: Docker E2E Tests

on:
  workflow_dispatch: # Manual trigger
  push:
    branches: [main] # Trigger on merge to main

env:
  IMAGE_NAME: looplia:test

jobs:
  # Build Docker image once and share with all test jobs
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME .

      - name: Save Docker image
        run: docker save $IMAGE_NAME | gzip > looplia-image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: looplia-image.tar.gz
          retention-days: 1

  # Test: Markdown file with full 3-stage pipeline
  test-markdown:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: gunzip -c looplia-image.tar.gz | docker load

      - name: Create test workspace
        run: mkdir -p test-workspace

      - name: Run writing-kit workflow
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          CONTAINER_ID=$(docker create \
            -e CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
            -v "$(pwd)/examples:/examples:ro" \
            $IMAGE_NAME \
            run writing-kit --file /examples/ai-healthcare.md \
            --topics "ai,healthcare,technology" \
            --tone "expert")

          # Run container and capture exit code
          docker start -a "$CONTAINER_ID" || EXIT_CODE=$?

          # Always copy files for debugging (even on failure)
          docker cp "$CONTAINER_ID:/home/looplia/.looplia/." test-workspace/ || true
          docker rm "$CONTAINER_ID"

          # Exit with original code
          exit ${EXIT_CODE:-0}

      - name: Debug - List workspace contents
        if: always()
        run: |
          echo "=== Workspace Structure ==="
          find test-workspace -type f 2>/dev/null | head -50 || echo "No files found"
          echo ""
          echo "=== Sandbox folder contents ==="
          SANDBOX_DIR=$(find test-workspace/sandbox -maxdepth 1 -type d ! -name sandbox 2>/dev/null | head -1)
          if [ -n "$SANDBOX_DIR" ]; then
            echo "Sandbox: $SANDBOX_DIR"
            ls -la "$SANDBOX_DIR" || true
            echo ""
            echo "=== inputs/content.md (first 20 lines) ==="
            head -20 "$SANDBOX_DIR/inputs/content.md" 2>/dev/null || echo "No content.md"
            echo ""
            echo "=== validation.json ==="
            cat "$SANDBOX_DIR/validation.json" 2>/dev/null || echo "No validation.json"
            echo ""
            echo "=== outputs/summary.json (if exists) ==="
            cat "$SANDBOX_DIR/outputs/summary.json" 2>/dev/null || echo "No summary.json"
            echo ""
            echo "=== outputs/writing-kit.json (if exists) ==="
            cat "$SANDBOX_DIR/outputs/writing-kit.json" 2>/dev/null | head -100 || echo "No writing-kit.json"
            echo ""
            echo "=== Query logs (last 200 lines) ==="
            LOG_FILE=$(ls "$SANDBOX_DIR/logs/"*.log 2>/dev/null | head -1)
            if [ -n "$LOG_FILE" ]; then
              tail -200 "$LOG_FILE"
            else
              echo "No query log found"
            fi
          else
            echo "No sandbox directory found"
            echo "Contents of test-workspace:"
            ls -laR test-workspace/ 2>/dev/null || echo "Empty"
          fi

      - name: Validate sandbox created
        run: |
          echo "Checking sandbox was created..."
          SANDBOX_DIR=$(find test-workspace/sandbox -maxdepth 1 -type d ! -name sandbox | head -1)
          [ -n "$SANDBOX_DIR" ] || (echo "ERROR: No sandbox directory found" && exit 1)
          echo "Sandbox folder: $SANDBOX_DIR"

          # Check inputs/content.md exists
          [ -f "$SANDBOX_DIR/inputs/content.md" ] || (echo "ERROR: inputs/content.md not found" && exit 1)
          echo "✓ inputs/content.md exists"

      - name: Validate pipeline artifacts
        run: |
          SANDBOX_DIR=$(find test-workspace/sandbox -maxdepth 1 -type d ! -name sandbox | head -1)

          # Check all 3 stage artifacts exist in outputs/
          [ -f "$SANDBOX_DIR/outputs/summary.json" ] || (echo "ERROR: outputs/summary.json not found (Stage 1)" && exit 1)
          echo "✓ outputs/summary.json exists (Stage 1)"

          [ -f "$SANDBOX_DIR/outputs/ideas.json" ] || (echo "ERROR: outputs/ideas.json not found (Stage 2)" && exit 1)
          echo "✓ outputs/ideas.json exists (Stage 2)"

          [ -f "$SANDBOX_DIR/outputs/writing-kit.json" ] || (echo "ERROR: outputs/writing-kit.json not found (Stage 3)" && exit 1)
          echo "✓ outputs/writing-kit.json exists (Stage 3)"

      - name: Validate writing-kit output
        run: |
          SANDBOX_DIR=$(find test-workspace/sandbox -maxdepth 1 -type d ! -name sandbox | head -1)

          # Validate basic structure
          jq -e '.contentId' "$SANDBOX_DIR/outputs/writing-kit.json" > /dev/null || (echo "ERROR: missing contentId" && exit 1)
          jq -e '.summary' "$SANDBOX_DIR/outputs/writing-kit.json" > /dev/null || (echo "ERROR: missing summary" && exit 1)
          jq -e '.ideas' "$SANDBOX_DIR/outputs/writing-kit.json" > /dev/null || (echo "ERROR: missing ideas" && exit 1)
          jq -e '.suggestedOutline' "$SANDBOX_DIR/outputs/writing-kit.json" > /dev/null || (echo "ERROR: missing suggestedOutline" && exit 1)
          echo "✓ outputs/writing-kit.json has valid structure"

      - name: Validate pipeline completion
        run: |
          SANDBOX_DIR=$(find test-workspace/sandbox -maxdepth 1 -type d ! -name sandbox | head -1)

          # Check validation.json exists
          [ -f "$SANDBOX_DIR/validation.json" ] || (echo "ERROR: validation.json not found" && exit 1)
          echo "✓ validation.json exists"

          # Check all steps are validated (v0.6.0 uses "steps" not "outputs")
          for step in summary ideas writing-kit; do
            VALIDATED=$(jq -r ".steps.\"$step\".validated // false" "$SANDBOX_DIR/validation.json")
            if [ "$VALIDATED" = "true" ]; then
              echo "✓ $step: validated"
            else
              echo "⚠ $step: NOT validated (may be expected if validation skill not yet implemented)"
            fi
          done

      - name: Verify subagent execution (v0.6.1 skills-first)
        run: |
          SANDBOX_DIR=$(find test-workspace/sandbox -maxdepth 1 -type d ! -name sandbox | head -1)
          LOG_FILE=$(ls "$SANDBOX_DIR/logs/"*.log 2>/dev/null | head -1)

          if [ -z "$LOG_FILE" ]; then
            echo "⚠ No log file found, skipping subagent verification"
            exit 0
          fi

          echo "=== Checking skill-executor usage (v0.6.1) ==="

          # Check for universal skill-executor (should appear for all steps)
          SKILL_EXEC_COUNT=$(grep -c '"subagent_type".*"skill-executor"' "$LOG_FILE" 2>/dev/null || echo "0")
          if [ "$SKILL_EXEC_COUNT" -ge 3 ]; then
            echo "✓ skill-executor used $SKILL_EXEC_COUNT times (expected >= 3)"
          else
            echo "✗ skill-executor count: $SKILL_EXEC_COUNT (expected >= 3)"
            exit 1
          fi

          # CRITICAL: Check for legacy agents (should NOT exist in v0.6.1)
          for legacy in content-analyzer idea-generator writing-kit-builder; do
            if grep -q "\"subagent_type\".*\"$legacy\"" "$LOG_FILE"; then
              echo "✗ FAIL: Legacy agent $legacy detected!"
              exit 1
            fi
          done
          echo "✓ No legacy agents found"

          # Check for general-purpose fallback (should NOT exist)
          if grep -q '"subagent_type".*"general-purpose"' "$LOG_FILE"; then
            echo "✗ FAIL: general-purpose subagent detected!"
            exit 1
          else
            echo "✓ No general-purpose fallback"
          fi

          # Count Task tool invocations
          TASK_COUNT=$(grep -c '"name".*"Task"' "$LOG_FILE" 2>/dev/null || echo "0")
          echo "Task tool invocations: $TASK_COUNT (expected >= 3)"

          # Verify correct skills used for each step
          # Log format: Task tool calls have:
          # { "subagent_type": "skill-executor",
          #   "description": "Execute step: {step-id}",
          #   "prompt": "Execute skill '{skill-name}' for step '{step-id}'..." }

          echo "=== Checking skill-to-step mapping ==="

          # Check step 'summary' uses skill 'media-reviewer'
          if grep -A5 '"description".*"Execute step: summary"' "$LOG_FILE" | grep -q '"prompt".*media-reviewer'; then
            echo "✓ Step 'summary' uses skill 'media-reviewer'"
          else
            echo "✗ Step 'summary' should use skill 'media-reviewer'"
            exit 1
          fi

          # Check step 'ideas' uses skill 'idea-synthesis'
          if grep -A5 '"description".*"Execute step: ideas"' "$LOG_FILE" | grep -q '"prompt".*idea-synthesis'; then
            echo "✓ Step 'ideas' uses skill 'idea-synthesis'"
          else
            echo "✗ Step 'ideas' should use skill 'idea-synthesis'"
            exit 1
          fi

          # Check step 'writing-kit' uses skill 'writing-kit-assembler'
          if grep -A5 '"description".*"Execute step: writing-kit"' "$LOG_FILE" | grep -q '"prompt".*writing-kit-assembler'; then
            echo "✓ Step 'writing-kit' uses skill 'writing-kit-assembler'"
          else
            echo "✗ Step 'writing-kit' should use skill 'writing-kit-assembler'"
            exit 1
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-markdown
          path: test-workspace/
          retention-days: 7

  # Test: Build command - generate workflow from natural language
  test-build:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: gunzip -c looplia-image.tar.gz | docker load

      - name: Create test workspace
        run: mkdir -p build-test-workspace

      - name: Run build command
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          CONTAINER_ID=$(docker create \
            -e CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
            $IMAGE_NAME \
            build "summarize articles and extract key points" \
            --name article-summary \
            --no-interactive)

          # Run container and capture exit code
          docker start -a "$CONTAINER_ID" || EXIT_CODE=$?

          # Copy workspace for validation
          docker cp "$CONTAINER_ID:/home/looplia/.looplia/." build-test-workspace/ || true
          docker rm "$CONTAINER_ID"

          # Exit with original code
          exit ${EXIT_CODE:-0}

      - name: Debug - List workspace contents
        if: always()
        run: |
          echo "=== Build Test Workspace Structure ==="
          find build-test-workspace -type f 2>/dev/null | head -50 || echo "No files found"
          echo ""
          echo "=== Workflows directory ==="
          ls -la build-test-workspace/workflows/ 2>/dev/null || echo "No workflows directory"
          echo ""
          echo "=== Generated workflow content ==="
          cat build-test-workspace/workflows/article-summary.md 2>/dev/null || echo "No article-summary.md"

      - name: Validate workflow file created
        run: |
          WORKFLOW_FILE="build-test-workspace/workflows/article-summary.md"

          # Check file exists
          [ -f "$WORKFLOW_FILE" ] || (echo "ERROR: Workflow file not created" && exit 1)
          echo "✓ Workflow file exists: $WORKFLOW_FILE"

          # Check file is not empty
          [ -s "$WORKFLOW_FILE" ] || (echo "ERROR: Workflow file is empty" && exit 1)
          echo "✓ Workflow file has content"

      - name: Validate YAML frontmatter schema
        run: |
          WORKFLOW_FILE="build-test-workspace/workflows/article-summary.md"

          # Extract YAML frontmatter (between first --- and second ---)
          sed -n '/^---$/,/^---$/p' "$WORKFLOW_FILE" | sed '1d;$d' > frontmatter.yaml
          echo "=== Frontmatter YAML ==="
          cat frontmatter.yaml

          # Validate required top-level fields
          yq -e '.name' frontmatter.yaml > /dev/null || (echo "ERROR: missing 'name' field" && exit 1)
          echo "✓ Has 'name' field"

          yq -e '.steps' frontmatter.yaml > /dev/null || (echo "ERROR: missing 'steps' array" && exit 1)
          echo "✓ Has 'steps' array"

          STEPS_COUNT=$(yq '.steps | length' frontmatter.yaml)
          echo "✓ Found $STEPS_COUNT steps"
          [ "$STEPS_COUNT" -ge 1 ] || (echo "ERROR: No steps defined" && exit 1)

      - name: Validate v0.6.1 skill syntax
        run: |
          WORKFLOW_FILE="build-test-workspace/workflows/article-summary.md"
          sed -n '/^---$/,/^---$/p' "$WORKFLOW_FILE" | sed '1d;$d' > frontmatter.yaml

          echo "=== Checking v0.6.1 skill syntax ==="

          # Each step should have 'skill:' field
          # Use proper yq length counting (not wc -l which counts lines, not entries)
          SKILL_COUNT=$(yq '[.steps[].skill | select(. != null)] | length' frontmatter.yaml)
          STEP_COUNT=$(yq '.steps | length' frontmatter.yaml)

          echo "Steps with 'skill:' field: $SKILL_COUNT / $STEP_COUNT"
          [ "$SKILL_COUNT" -eq "$STEP_COUNT" ] || (echo "ERROR: Not all steps have 'skill:' field" && exit 1)
          echo "✓ All steps have 'skill:' field"

          # Each step should have 'mission:' field
          # Use proper yq length counting (not wc -l which counts lines for multi-line values)
          MISSION_COUNT=$(yq '[.steps[].mission | select(. != null)] | length' frontmatter.yaml)
          echo "Steps with 'mission:' field: $MISSION_COUNT / $STEP_COUNT"
          [ "$MISSION_COUNT" -eq "$STEP_COUNT" ] || (echo "ERROR: Not all steps have 'mission:' field" && exit 1)
          echo "✓ All steps have 'mission:' field"

          # No step should have legacy 'run:' field
          RUN_COUNT=$(yq '[.steps[].run | select(. != null)] | length' frontmatter.yaml)
          [ "$RUN_COUNT" -eq 0 ] || (echo "ERROR: Found legacy 'run:' syntax in $RUN_COUNT steps" && exit 1)
          echo "✓ No legacy 'run:' syntax found"

      - name: Validate referenced skills exist
        run: |
          WORKFLOW_FILE="build-test-workspace/workflows/article-summary.md"
          sed -n '/^---$/,/^---$/p' "$WORKFLOW_FILE" | sed '1d;$d' > frontmatter.yaml

          echo "=== Checking referenced skills ==="

          # Get list of referenced skills
          SKILLS=$(yq -r '.steps[].skill' frontmatter.yaml | sort -u)

          # Check each skill exists in plugins directory
          for skill in $SKILLS; do
            SKILL_PATH=$(find build-test-workspace/plugins -name "$skill" -type d 2>/dev/null | head -1)
            if [ -n "$SKILL_PATH" ]; then
              echo "✓ Skill '$skill' found at: $SKILL_PATH"
            else
              echo "⚠ Skill '$skill' not found in plugins (may be external)"
            fi
          done

      - name: Upload build test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-build
          path: build-test-workspace/
          retention-days: 7

