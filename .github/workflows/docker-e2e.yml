name: Docker E2E Tests

on:
  workflow_dispatch: # Manual trigger
  push:
    branches: [main] # Trigger on merge to main

env:
  IMAGE_NAME: looplia:test

jobs:
  # Build Docker image once and share with all test jobs
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME .

      - name: Save Docker image
        run: docker save $IMAGE_NAME | gzip > looplia-image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: looplia-image.tar.gz
          retention-days: 1

  # Test: Markdown file with full 3-stage pipeline
  test-markdown:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: gunzip -c looplia-image.tar.gz | docker load

      - name: Create test workspace
        run: mkdir -p test-workspace

      - name: Run writing-kit workflow
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          CONTAINER_ID=$(docker create \
            -e CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
            -v "$(pwd)/examples:/examples:ro" \
            $IMAGE_NAME \
            run writing-kit --file /examples/ai-healthcare.md \
            --topics "ai,healthcare,technology" \
            --tone "expert")

          # Run container and capture exit code
          docker start -a "$CONTAINER_ID" || EXIT_CODE=$?

          # Always copy files for debugging (even on failure)
          docker cp "$CONTAINER_ID:/home/looplia/.looplia/." test-workspace/ || true
          docker rm "$CONTAINER_ID"

          # Exit with original code
          exit ${EXIT_CODE:-0}

      - name: Debug - List workspace contents
        if: always()
        run: |
          echo "=== Workspace Structure ==="
          find test-workspace -type f 2>/dev/null | head -50 || echo "No files found"
          echo ""
          echo "=== Session folder contents ==="
          SESSION_DIR=$(find test-workspace/contentItem -maxdepth 1 -type d ! -name contentItem 2>/dev/null | head -1)
          if [ -n "$SESSION_DIR" ]; then
            echo "Session: $SESSION_DIR"
            ls -la "$SESSION_DIR" || true
            echo ""
            echo "=== content.md (first 20 lines) ==="
            head -20 "$SESSION_DIR/content.md" 2>/dev/null || echo "No content.md"
            echo ""
            echo "=== validation.json ==="
            cat "$SESSION_DIR/validation.json" 2>/dev/null || echo "No validation.json"
            echo ""
            echo "=== summary.json (if exists) ==="
            cat "$SESSION_DIR/summary.json" 2>/dev/null || echo "No summary.json"
            echo ""
            echo "=== writing-kit.json (if exists) ==="
            cat "$SESSION_DIR/writing-kit.json" 2>/dev/null | head -100 || echo "No writing-kit.json"
            echo ""
            echo "=== Query logs (last 200 lines) ==="
            LOG_FILE=$(ls "$SESSION_DIR/logs/"*.log 2>/dev/null | head -1)
            if [ -n "$LOG_FILE" ]; then
              tail -200 "$LOG_FILE"
            else
              echo "No query log found"
            fi
          else
            echo "No session directory found"
            echo "Contents of test-workspace:"
            ls -laR test-workspace/ 2>/dev/null || echo "Empty"
          fi

      - name: Validate session created
        run: |
          echo "Checking session was created..."
          SESSION_DIR=$(find test-workspace/contentItem -maxdepth 1 -type d ! -name contentItem | head -1)
          [ -n "$SESSION_DIR" ] || (echo "ERROR: No session directory found" && exit 1)
          echo "Session folder: $SESSION_DIR"

          # Check content.md exists
          [ -f "$SESSION_DIR/content.md" ] || (echo "ERROR: content.md not found" && exit 1)
          echo "✓ content.md exists"

      - name: Validate pipeline artifacts
        run: |
          SESSION_DIR=$(find test-workspace/contentItem -maxdepth 1 -type d ! -name contentItem | head -1)

          # Check all 3 stage artifacts exist
          [ -f "$SESSION_DIR/summary.json" ] || (echo "ERROR: summary.json not found (Stage 1)" && exit 1)
          echo "✓ summary.json exists (Stage 1)"

          [ -f "$SESSION_DIR/ideas.json" ] || (echo "ERROR: ideas.json not found (Stage 2)" && exit 1)
          echo "✓ ideas.json exists (Stage 2)"

          [ -f "$SESSION_DIR/writing-kit.json" ] || (echo "ERROR: writing-kit.json not found (Stage 3)" && exit 1)
          echo "✓ writing-kit.json exists (Stage 3)"

      - name: Validate writing-kit output
        run: |
          SESSION_DIR=$(find test-workspace/contentItem -maxdepth 1 -type d ! -name contentItem | head -1)

          # Validate basic structure
          jq -e '.contentId' "$SESSION_DIR/writing-kit.json" > /dev/null || (echo "ERROR: missing contentId" && exit 1)
          jq -e '.summary' "$SESSION_DIR/writing-kit.json" > /dev/null || (echo "ERROR: missing summary" && exit 1)
          jq -e '.ideas' "$SESSION_DIR/writing-kit.json" > /dev/null || (echo "ERROR: missing ideas" && exit 1)
          jq -e '.suggestedOutline' "$SESSION_DIR/writing-kit.json" > /dev/null || (echo "ERROR: missing suggestedOutline" && exit 1)
          echo "✓ writing-kit.json has valid structure"

      - name: Validate pipeline completion
        run: |
          SESSION_DIR=$(find test-workspace/contentItem -maxdepth 1 -type d ! -name contentItem | head -1)

          # Check validation.json exists
          [ -f "$SESSION_DIR/validation.json" ] || (echo "ERROR: validation.json not found" && exit 1)
          echo "✓ validation.json exists"

          # Check all outputs are validated
          for output in summary ideas writing-kit; do
            VALIDATED=$(jq -r ".outputs.\"$output\".validated // false" "$SESSION_DIR/validation.json")
            if [ "$VALIDATED" = "true" ]; then
              echo "✓ $output: validated"
            else
              echo "⚠ $output: NOT validated (may be expected if validation skill not yet implemented)"
            fi
          done

      - name: Verify subagent execution
        run: |
          SESSION_DIR=$(find test-workspace/contentItem -maxdepth 1 -type d ! -name contentItem | head -1)
          LOG_FILE=$(ls "$SESSION_DIR/logs/"*.log 2>/dev/null | head -1)

          if [ -z "$LOG_FILE" ]; then
            echo "⚠ No log file found, skipping subagent verification"
            exit 0
          fi

          echo "=== Checking subagent types ==="

          # Check for custom subagent types
          if grep -q '"subagent_type".*"content-analyzer"' "$LOG_FILE"; then
            echo "✓ content-analyzer subagent used"
          else
            echo "✗ content-analyzer NOT found"
          fi

          if grep -q '"subagent_type".*"idea-generator"' "$LOG_FILE"; then
            echo "✓ idea-generator subagent used"
          else
            echo "✗ idea-generator NOT found"
          fi

          if grep -q '"subagent_type".*"writing-kit-builder"' "$LOG_FILE"; then
            echo "✓ writing-kit-builder subagent used"
          else
            echo "✗ writing-kit-builder NOT found"
          fi

          # CRITICAL: Check for general-purpose (should NOT exist)
          if grep -q '"subagent_type".*"general-purpose"' "$LOG_FILE"; then
            echo "✗ FAIL: general-purpose subagent detected!"
            exit 1
          else
            echo "✓ No general-purpose fallback"
          fi

          # Count Task tool invocations
          TASK_COUNT=$(grep -c '"name".*"Task"' "$LOG_FILE" 2>/dev/null || echo "0")
          echo "Task tool invocations: $TASK_COUNT (expected >= 3)"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-markdown
          path: test-workspace/
          retention-days: 7

  # Commented out for now - focus on markdown test first
  # test-vtt:
  #   ...

  # test-srt:
  #   ...

  # semantic-evaluation:
  #   ...
