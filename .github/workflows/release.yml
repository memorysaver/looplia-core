name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and validate version
        id: version
        run: |
          # Extract version from tag (remove 'v' prefix)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"

          # Extract version from CLI package.json
          CLI_VERSION=$(jq -r '.version' apps/cli/package.json)
          echo "CLI package version: $CLI_VERSION"

          # Compare versions
          if [ "$TAG_VERSION" != "$CLI_VERSION" ]; then
            echo "::error::Version mismatch! Tag: v$TAG_VERSION, package.json: $CLI_VERSION"
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version validated: $TAG_VERSION"

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lint
        run: bun x ultracite check

      - name: Type check
        run: bun run check-types

      - name: Test
        run: bun test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/cli/dist
            packages/core/dist
            packages/provider/dist
          retention-days: 1

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Copy plugins to CLI
        run: bun run copy-plugins
        working-directory: apps/cli

      - name: Check if version exists
        id: check-version
        run: |
          VERSION=$(jq -r '.version' apps/cli/package.json)
          if npm view @looplia/looplia-cli@$VERSION version 2>/dev/null; then
            echo "Version $VERSION already published, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION not found, will publish"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check-version.outputs.exists == 'false'
        run: npm publish --provenance --access public
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy docs
        run: bun run deploy
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-test, publish-npm, publish-docs]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create plugins tarball
        run: |
          # Extract plugin folder names from marketplace.json
          PLUGINS=$(jq -r '.plugins[].source | split("/") | .[-1]' .claude-plugin/marketplace.json | tr '\n' ' ')
          echo "Packing plugins: $PLUGINS"
          cd plugins
          tar -czvf ../plugins.tar.gz $PLUGINS
          cd ..
          sha256sum plugins.tar.gz > plugins.tar.gz.sha256
          echo "Checksum: $(cat plugins.tar.gz.sha256)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plugins.tar.gz
            plugins.tar.gz.sha256
          generate_release_notes: true
